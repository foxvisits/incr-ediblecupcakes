name: Content publish (scheduled recipes)

on:
  # The publish queue lives in content/scheduled/. `publish-due` only acts on
  # items whose publish date has arrived, so one run a day is enough — the
  # previous hourly cron fired ~720 times a month, almost always finding
  # nothing to do.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # A push authenticated with the default GITHUB_TOKEN does not count as
      # repository activity, so it cannot stop GitHub disabling these scheduled
      # workflows after 60 days (see docs/AUTOMATION.md). CONTENT_BOT_TOKEN, a
      # fine-grained PAT with "Contents: write", makes the pushes count.
      #
      # Fine-grained PATs expire. When this one did, on 1 November 2026, the
      # checkout itself failed and nothing was published for days. So the token
      # is tested first: a working token is used; a rejected one falls back to
      # GITHUB_TOKEN so the day's recipe still goes out, and the last step then
      # fails the run so the expiry still reaches the owner as a failure email.
      - name: Check the bot token
        id: bot
        env:
          BOT_TOKEN: ${{ secrets.CONTENT_BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "state=missing" >> "$GITHUB_OUTPUT"
            echo "::warning::CONTENT_BOT_TOKEN is not set; publishing with GITHUB_TOKEN (see docs/AUTOMATION.md)."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $BOT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY")
          case "$code" in
            200)
              echo "state=ok" >> "$GITHUB_OUTPUT" ;;
            401|403|404)
              echo "state=rejected" >> "$GITHUB_OUTPUT"
              echo "::error::CONTENT_BOT_TOKEN was rejected (HTTP $code): expired, revoked, or no access to this repository. Publishing with GITHUB_TOKEN for now." ;;
            *)
              # GitHub's API itself is having trouble; the token may be fine.
              # Publish with the fallback and do not fail the run over it.
              echo "state=unknown" >> "$GITHUB_OUTPUT"
              echo "::warning::Could not verify CONTENT_BOT_TOKEN (HTTP $code); publishing with GITHUB_TOKEN this run." ;;
          esac

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.bot.outputs.state == 'ok' && secrets.CONTENT_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Publish due recipes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: npm run content:publish-due

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `git add -A` over the content roots: the previous explicit globs
          # (public/*-2.jpg etc.) abort the whole step the first time a run
          # produces no file matching one of them.
          git add -A content src/data/recipes/generated src/data/guides/generated public
          git diff --staged --quiet && echo "Nothing due to publish." && exit 0
          git commit -m "content: publish scheduled recipes [automated]"
          git push -u origin HEAD:${GITHUB_REF_NAME}

      - name: Fail if the bot token needs renewing
        if: steps.bot.outputs.state == 'rejected'
        run: |
          echo "::error::Today's content was published with the fallback token, but CONTENT_BOT_TOKEN is expired or revoked. Renew it under GitHub > Settings > Developer settings > Fine-grained tokens, then update the repository secret. Until then, these pushes do not reset GitHub's 60-day inactivity timer."
          exit 1
